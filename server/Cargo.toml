[package]
name = "galley"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.1"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.23.1"
hex = "0.4.3"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mime_guess = "2.0.5"
pulldown-cmark = "0.13.4"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = { version = "3.2.0", features = ["text"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
insta = "1.49.0"
tower = { version = "0.5.3", features = ["util"] }
